[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "istanbul-mcp"
version = "0.2.4"
description = "Remote MCP server for Istanbul open city data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mcp>=2.3,<3",
  "pydantic>=2.12,<3",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "zeep>=4.2",
  "sqlglot>=30.23,<31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "jsonschema>=4.20",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: opt-in external-source acceptance checks"]
